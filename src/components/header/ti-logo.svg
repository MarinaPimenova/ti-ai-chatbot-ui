<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 64" role="img" aria-label="TI Logo">
  <defs>
    <linearGradient id="ti-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#0067B8"/>
    </linearGradient>
  </defs>

  <!-- Circular Motion Mark -->
  <g transform="translate(4, 2)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="#0078D4" stroke-width="4" opacity="0.15" />
    <path d="M 28,2 A 26,26 0 0,1 54,28" fill="none" stroke="url(#ti-blue)" stroke-width="4" stroke-linecap="round" />

    <!-- TI Monogram -->
    <!-- 'T' -->
    <path d="M 12 18 H 32 M 22 18 V 38" stroke="#062B63" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- 'I' -->
    <path d="M 38 18 V 38" stroke="url(#ti-blue)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="39" fill="#062B63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="1">TI</text>
</svg>
